<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Lire avec Alia{% endblock %}</title>
  <meta property="og:title" content="Lire avec Alia ✨">
  <meta property="og:description" content="Apprendre à lire en français — avec Karumi !">
  <meta property="og:image" content="https://alia-adri.com/static/characters/karumi.png">
  <meta property="og:url" content="https://alia-adri.com">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
  {% block css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  {% block js %}{% endblock %}
</body>
</html>
