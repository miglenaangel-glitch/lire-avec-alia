<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Lire avec Alia</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #0f0f1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #1a1a2e; border-radius: 20px; padding: 2.5rem; width: min(360px, 90vw); text-align: center; }
    .box h1 { color: #a78bfa; font-size: 1.4rem; margin-bottom: 0.5rem; }
    .box p { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
    input[type=password] { width: 100%; padding: 0.8rem 1rem; background: #0f0f1a; border: 1.5px solid #334155; border-radius: 10px; color: #f1f5f9; font-size: 1rem; font-family: 'Nunito', sans-serif; margin-bottom: 1rem; outline: none; box-sizing: border-box; }
    input[type=password]:focus { border-color: #7c3aed; }
    button { width: 100%; background: #7c3aed; color: white; border: none; padding: 0.9rem; border-radius: 50px; font-size: 1rem; font-weight: 700; font-family: 'Nunito', sans-serif; cursor: pointer; }
    .error { color: #ef4444; font-size: 0.9rem; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔐 Admin Panel</h1>
    <p>Lire avec Alia — Espace administrateur</p>
    <form method="POST">
      <input type="password" name="password" placeholder="Mot de passe admin" autofocus>
      <button type="submit">Entrer</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
