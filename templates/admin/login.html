<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Администрация — Lire avec Alia</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2.5rem; width: min(360px, 90vw); text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .box h1 { color: #7c3aed; font-size: 1.4rem; margin-bottom: 0.4rem; }
    .box p { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
    input[type=password] { width: 100%; padding: 0.8rem 1rem; background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 10px; color: #1e293b; font-size: 1rem; font-family: 'Nunito', sans-serif; margin-bottom: 1rem; outline: none; box-sizing: border-box; }
    input[type=password]:focus { border-color: #7c3aed; background: #fff; }
    button { width: 100%; background: #7c3aed; color: white; border: none; padding: 0.9rem; border-radius: 50px; font-size: 1rem; font-weight: 700; font-family: 'Nunito', sans-serif; cursor: pointer; }
    button:hover { background: #6d28d9; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔐 Администрация</h1>
    <p>Lire avec Alia — административен панел</p>
    <form method="POST">
      <input type="password" name="password" placeholder="Парола" autofocus>
      <button type="submit">Влез</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
