<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Maman — Lire avec Alia</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #fdf8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; border: 1px solid #e8d5b7; border-radius: 20px; padding: 2.5rem; width: min(360px, 90vw); text-align: center; box-shadow: 0 4px 24px rgba(44,24,16,0.08); }
    .box h1 { color: #c2622a; font-size: 1.5rem; margin-bottom: 0.4rem; }
    .box p { color: #8b6f5e; font-size: 0.9rem; margin-bottom: 2rem; }
    input[type=password] { width: 100%; padding: 0.8rem 1rem; background: #fdf8f0; border: 1.5px solid #e8d5b7; border-radius: 10px; color: #2c1810; font-size: 1rem; font-family: 'Nunito', sans-serif; margin-bottom: 1rem; outline: none; box-sizing: border-box; }
    input[type=password]:focus { border-color: #c2622a; }
    button { width: 100%; background: #c2622a; color: white; border: none; padding: 0.9rem; border-radius: 50px; font-size: 1rem; font-weight: 700; font-family: 'Nunito', sans-serif; cursor: pointer; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 0.8rem; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:2.5rem;margin-bottom:0.5rem;">💝</div>
    <h1>Espace Maman</h1>
    <p>Lire avec Alia — Кабинет на мама</p>
    <form method="POST">
      <input type="password" name="password" placeholder="Mot de passe" autofocus>
      <button type="submit">Entrer</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
