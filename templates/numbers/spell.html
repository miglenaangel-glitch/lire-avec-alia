{% extends "numbers/base.html" %}
{% block title %}Épeler — Les Nombres{% endblock %}

{% block content %}
<div class="num-header">
  <a href="{{ url_for('numbers.home') }}" class="num-back">←</a>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog" style="width:0%"></div></div>
  <a href="/" class="num-back">🏠</a>
</div>

<div class="num-page" style="text-align:center;">
  <p style="color:var(--muted);margin-bottom:1rem;font-size:0.95rem;">Remets les lettres dans l'ordre !</p>

  <!-- Big digit -->
  <div id="spell-digit" style="font-size:5rem;font-weight:900;color:var(--consonant);font-family:var(--font-letters);margin-bottom:1.5rem;line-height:1;"></div>

  <!-- Answer slots -->
  <div id="answer-slots" style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;min-height:60px;margin-bottom:1.5rem;background:var(--accent-bg);border-radius:12px;padding:1rem;border:2px dashed var(--border);"></div>

  <!-- Letter tiles -->
  <div id="letter-tiles" style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-bottom:1.5rem;"></div>

  <p id="spell-feedback" style="font-size:1.2rem;font-weight:700;min-height:2rem;"></p>
  <button id="spell-next" onclick="nextSpell()" class="btn-primary" style="display:none;margin-top:1rem;">Suivant →</button>
  <button onclick="clearAnswer()" class="btn-secondary" style="margin-top:0.8rem;display:block;margin:0.8rem auto 0;">✕ Effacer</button>
</div>
{% endblock %}

{% block js %}
<script>
const NUMBERS = {{ numbers | tojson }};
const LEVEL = "{{ level }}";
const VOWELS = 'aeéèêëiîïoôuûùy';
let shuffled = [...NUMBERS].sort(() => Math.random() - 0.5);
let idx = 0;
let answer = [];
let target = '';

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = 'fr-FR'; u.rate = 0.6;
  const voices = speechSynthesis.getVoices();
  const fr = voices.find(v => v.lang.startsWith('fr') && v.localService) || voices.find(v => v.lang.startsWith('fr'));
  if (fr) u.voice = fr;
  speechSynthesis.speak(u);
}

function getLetterClass(ch) {
  const lc = ch.toLowerCase();
  if (lc === '-' || lc === ' ') return 's';
  if (!/[a-zàâäéèêëîïôùûüœç]/.test(lc)) return '';
  return VOWELS.includes(lc) ? 'v' : 'c';
}

function showSpell() {
  if (idx >= shuffled.length) { showComplete(); return; }
  const current = shuffled[idx];
  target = current.word;
  answer = [];

  document.getElementById('spell-digit').textContent = current.digit;
  document.getElementById('spell-feedback').textContent = '';
  document.getElementById('spell-next').style.display = 'none';
  document.getElementById('answer-slots').innerHTML = '';

  // Shuffled letters (excluding spaces, keeping hyphens as special)
  const letters = target.split('').map((ch, i) => ({ch, idx: i}));
  const shuffledLetters = [...letters].sort(() => Math.random() - 0.5);

  const tilesDiv = document.getElementById('letter-tiles');
  tilesDiv.innerHTML = '';
  shuffledLetters.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.id = 'tile-' + i;
    btn.textContent = item.ch;
    btn.dataset.ch = item.ch;
    btn.dataset.origIdx = item.idx;
    const cls = getLetterClass(item.ch);
    btn.style.cssText = `width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-size:1.3rem;font-weight:800;cursor:pointer;font-family:var(--font-letters);color:${cls === 'v' ? 'var(--vowel)' : cls === 'c' ? 'var(--consonant)' : 'var(--silent)'};transition:all 0.15s;`;
    btn.onclick = () => addLetter(item.ch, btn);
    tilesDiv.appendChild(btn);
  });

  document.getElementById('prog').style.width = (idx / shuffled.length * 100) + '%';
  setTimeout(() => speak(current.digit), 400);
}

function addLetter(ch, btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.style.opacity = '0.3';
  answer.push(ch);
  renderAnswer();
  checkAnswer();
}

function renderAnswer() {
  const div = document.getElementById('answer-slots');
  div.innerHTML = '';
  answer.forEach(ch => {
    const span = document.createElement('span');
    span.textContent = ch;
    const cls = getLetterClass(ch);
    span.style.cssText = `display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:var(--surface);border:2px solid var(--border);font-size:1.3rem;font-weight:800;font-family:var(--font-letters);color:${cls === 'v' ? 'var(--vowel)' : cls === 'c' ? 'var(--consonant)' : 'var(--silent)'};`;
    div.appendChild(span);
  });
}

function clearAnswer() {
  answer = [];
  document.getElementById('answer-slots').innerHTML = '';
  document.getElementById('spell-feedback').textContent = '';
  document.querySelectorAll('#letter-tiles button').forEach(b => {
    b.disabled = false; b.style.opacity = '1';
  });
}

function checkAnswer() {
  if (answer.length < target.length) return;
  const typed = answer.join('').toLowerCase();
  const correct = typed === target.toLowerCase();
  const fb = document.getElementById('spell-feedback');
  if (correct) {
    fb.textContent = 'Bravo ! 🎉';
    fb.style.color = 'var(--success)';
    speak('Bravo !');
    setTimeout(() => speak(shuffled[idx].word), 1000);
    recordAnswer(shuffled[idx].digit, target, true);
    launchConfetti();
    document.getElementById('spell-next').style.display = 'inline-block';
  } else {
    fb.textContent = 'Pas tout à fait… réessaie ! 💪';
    fb.style.color = 'var(--error)';
    speak(target);
    recordAnswer(shuffled[idx].digit, target, false);
    setTimeout(() => clearAnswer(), 1500);
  }
}

function nextSpell() { idx++; showSpell(); }

function showComplete() {
  document.getElementById('spell-digit').textContent = '🌟';
  document.getElementById('spell-feedback').textContent = 'Tu as tout épelé ! Bravo !';
  document.getElementById('spell-feedback').style.color = 'var(--success)';
  document.getElementById('letter-tiles').innerHTML = '';
  document.getElementById('answer-slots').innerHTML = '';
  speak('Tu as tout épelé ! Bravo !');
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#c2622a','#1a3a6b','#c0392b','#f59e0b'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.textContent = '⭐';
      const x = Math.random() * 100, dur = 2 + Math.random() * 2;
      el.style.cssText = `position:fixed;left:${x}%;top:-5%;font-size:1.2rem;color:${colors[Math.floor(Math.random()*colors.length)]};animation:confettiFall ${dur}s linear forwards;z-index:100;pointer-events:none;`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 500);
    }, i * 60);
  }
}

async function recordAnswer(numberValue, wordForm, correct) {
  await fetch('/numbers/api/record', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({level: LEVEL, number_value: numberValue, word_form: wordForm, correct})
  });
}

document.addEventListener('DOMContentLoaded', () => { speechSynthesis.getVoices(); showSpell(); });
</script>
{% endblock %}
